services:
  - type: web
    name: taskflow-ai-backend
    runtime: node
    rootDir: Backend of TA-MS
    plan: starter
    autoDeploy: true
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate && npm run db:seed
    startCommand: npm run start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-ai-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL_MINUTES
        value: 15
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 7
      - key: BCRYPT_SALT_ROUNDS
        value: 12
      - key: SEED_USER_NAME
        value: TaskFlow Admin
      - key: SEED_USER_EMAIL
        sync: false
      - key: SEED_USER_PASSWORD
        sync: false

databases:
  - name: taskflow-ai-postgres
    databaseName: taskflow_ai
    user: taskflow_ai
    plan: basic-256mb
