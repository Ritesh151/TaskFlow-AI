<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TaskFlow AI Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Geist", ui-sans-serif, system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, rgba(37, 99, 235, 0.16), transparent 42%), #eff6ff;
        color: #0f172a;
      }
      main {
        max-width: 560px;
        margin: 24px;
        border: 1px solid rgba(255, 255, 255, 0.72);
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.88);
        padding: 32px;
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.08);
        backdrop-filter: blur(18px);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 32px;
      }
      p {
        margin: 0;
        line-height: 1.6;
        color: #475569;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline.</h1>
      <p>TaskFlow AI cached the latest app shell for you. Reconnect to sync tasks, attendance updates, and new notes.</p>
    </main>
  </body>
</html>
