name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  lint:
    name: Lint (${{ matrix.app.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - name: frontend
            working_directory: FrontEnd TA-MS
            lockfile: FrontEnd TA-MS/package-lock.json
          - name: backend
            working_directory: Backend of TA-MS
            lockfile: Backend of TA-MS/package-lock.json
    defaults:
      run:
        working-directory: ${{ matrix.app.working_directory }}
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NODE_ENV: test
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskflow_ai
      JWT_SECRET: ci-jwt-secret-at-least-32-characters
      COOKIE_SECRET: ci-cookie-secret
      ACCESS_TOKEN_TTL_MINUTES: 15
      REFRESH_TOKEN_TTL_DAYS: 7
      BCRYPT_SALT_ROUNDS: 12
      SEED_USER_NAME: TaskFlow Admin
      SEED_USER_EMAIL: admin@example.com
      SEED_USER_PASSWORD: ChangeMe123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app.lockfile }}
      - run: npm ci
      - run: npm run lint

  build:
    name: Build (${{ matrix.app.name }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - name: frontend
            working_directory: FrontEnd TA-MS
            lockfile: FrontEnd TA-MS/package-lock.json
          - name: backend
            working_directory: Backend of TA-MS
            lockfile: Backend of TA-MS/package-lock.json
    defaults:
      run:
        working-directory: ${{ matrix.app.working_directory }}
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NODE_ENV: test
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskflow_ai
      JWT_SECRET: ci-jwt-secret-at-least-32-characters
      COOKIE_SECRET: ci-cookie-secret
      ACCESS_TOKEN_TTL_MINUTES: 15
      REFRESH_TOKEN_TTL_DAYS: 7
      BCRYPT_SALT_ROUNDS: 12
      SEED_USER_NAME: TaskFlow Admin
      SEED_USER_EMAIL: admin@example.com
      SEED_USER_PASSWORD: ChangeMe123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app.lockfile }}
      - run: npm ci
      - run: npm run build

  test:
    name: Test (${{ matrix.app.name }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - name: frontend
            working_directory: FrontEnd TA-MS
            lockfile: FrontEnd TA-MS/package-lock.json
          - name: backend
            working_directory: Backend of TA-MS
            lockfile: Backend of TA-MS/package-lock.json
    defaults:
      run:
        working-directory: ${{ matrix.app.working_directory }}
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NODE_ENV: test
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskflow_ai
      JWT_SECRET: ci-jwt-secret-at-least-32-characters
      COOKIE_SECRET: ci-cookie-secret
      ACCESS_TOKEN_TTL_MINUTES: 15
      REFRESH_TOKEN_TTL_DAYS: 7
      BCRYPT_SALT_ROUNDS: 12
      SEED_USER_NAME: TaskFlow Admin
      SEED_USER_EMAIL: admin@example.com
      SEED_USER_PASSWORD: ChangeMe123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app.lockfile }}
      - run: npm ci
      - run: npm test
